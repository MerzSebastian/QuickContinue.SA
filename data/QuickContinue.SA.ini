; QuickContinue.SA
;
; This file holds the DEFAULTS. Four of the settings can also be changed in the game, under Options > Quick start.
; Those four are marked [IN GAME] below. What you change in the game is saved to QuickContinue.SA.cfg (next to your save
; games) and is used INSTEAD of the value in this file. The value here is then only what "Reset to defaults" goes back to.
; All other settings, marked [INI ONLY], are read from this file only; the game menu never changes them.
; With SettingsMenu=0 the menu page does not exist and the cfg file is ignored: this file is then the only source.

[QuickContinue]

; ---- Can be changed in the game (Options > Quick start) ----------------------------------------------------------

; [IN GAME] Adds a "Continue" entry to the main menu that loads the newest save game.
ContinueButton=1

; [IN GAME] 1 = skip the menu entirely and load the newest save game right after startup.
AutoLoad=0

; [IN GAME] Pause menu: adds "Load latest save" below "Resume", to start over quickly from your newest save. 0 hides it.
PauseMenuLoadLatest=1

; [IN GAME] 1 = the game first asks "All unsaved progress in your current game will be lost. Proceed with loading?" (safer).
; 0 = load at once, without asking.
PauseMenuConfirm=1

; ---- Only in this file ---------------------------------------------------------------------------------------------

; [INI ONLY] 1 = adds Options > Quick start, where the four settings above can be switched in the game. 0 = no page,
; and QuickContinue.SA.cfg is ignored.
SettingsMenu=1

; [INI ONLY] Virtual-key code that, held while the game starts, disables AutoLoad for that run.
; 17 = Ctrl (default), 16 = Shift, 18 = Alt, 0 = never skip.
SkipKey=17

; [INI ONLY] Skip the EAX/NVIDIA splashes, Logo.mpg and the GTAtitles.mpg intro video.
SkipIntro=1

; [INI ONLY] Skip the fade-in/fade-out of the copyright image that is shown while the game loads.
SkipTitleFade=1

; [INI ONLY] Show the first loading image at once instead of fading it in from black.
SmoothLoadScreen=1

; [INI ONLY] Language of the entries: en, de, fr, it, es, pt, nl, sv, fi, hu.
; Empty = follow the game language (English, German, French, Italian, Spanish). Set it when a language mod
; (Polish, Russian, Czech ...) replaces one of those slots; the plugin cannot see that on its own.
Language=

; [INI ONLY] 0 = no log file at all. 1 = write QuickContinue.SA.log (patch addresses, menu/loading state changes). Use it for bug reports.
Debug=0

[Text]
; [INI ONLY] Your own wording, in any language (beats Language=). Leave a key empty to use the built-in text. Only
; characters that the game's font has are shown; save this file in the Windows code page of your language.

; Entry in the main menu / in the pause menu
Continue=
LoadLatest=

; Settings page (Options): its name (the entry in the Options list shows it in capitals), the four switches, the note and
; the reset entry
PageName=
ContinueButton=
AutoLoad=
PauseLoadLatest=
PauseAskFirst=
RestartNote=
ResetButton=
