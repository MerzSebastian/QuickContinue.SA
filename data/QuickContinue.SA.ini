[QuickContinue]
; Adds a "Continue" entry to the main menu that loads the newest save game.
ContinueButton=1

; 1 = skip the menu entirely and load the newest save game right after startup.
AutoLoad=0

; Virtual-key code that, held while the game starts, disables AutoLoad for that run.
; 17 = Ctrl (default), 16 = Shift, 18 = Alt, 0 = never skip.
SkipKey=17

; Skip the EAX/NVIDIA splashes, Logo.mpg and the GTAtitles.mpg intro video.
SkipIntro=1

; Skip the fade-in/fade-out of the copyright image that is shown while the game loads.
SkipTitleFade=1

; Show the first loading image at once instead of fading it in from black.
SmoothLoadScreen=1

; 1 = write extra details (patch addresses, menu/loading state changes) to the log. Use it for bug reports.
Debug=0
